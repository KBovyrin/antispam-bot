name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Тесты и сборка (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify (тесты + линтеры сборки)
        run: ./mvnw -B verify

  smoke:
    name: Docker-сборка и smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # smoke.sh предпочитает podman (на runners он предустановлен), иначе docker;
      # сборка Maven внутри образа идёт без кеша — ограничиваем время задания
      - name: Сборка образа и smoke-запуск (schema.sql в volume)
        timeout-minutes: 30
        run: bash scripts/smoke.sh
