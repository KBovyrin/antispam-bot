services:
  antispam-bot:
    build: .
    container_name: antispam-bot
    restart: unless-stopped
    # Бот лёгкий (~300–500 МБ по замерам DEPLOY §1): 1 ГБ хватает с запасом,
    # а JVM в контейнере cgroup-aware и сама ограничит heap его долей
    mem_limit: 1g
    # Ротация: без неё json-file-логи долгоживущего VPS растут бесконечно (N9)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Spring гасит polling через @PreDestroy — даём ему больше дефолтных 10 секунд
    stop_grace_period: 30s
    env_file: .env
    environment:
      DB_URL: jdbc:sqlite:/data/antispam.db
    healthcheck:
      # Только liveness процесса: зависший polling этот чек не ловит — осознанный
      # трейд-офф (полный healthcheck потребовал бы актуатора). pgrep -x: точное
      # имя процесса java; -f с "app.jar" матчило бы сам healthcheck-шелл
      test: ["CMD-SHELL", "pgrep -x java || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Named volume: права внутри контейнера настраивает Docker (пользователь bot, не root)
      - antispam-data:/data

volumes:
  antispam-data:
